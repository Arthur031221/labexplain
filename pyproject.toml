[project]
name = "labexplain"
version = "0.1.0"
description = "Explain your blood test results offline. OCR a lab report photo or PDF, match every value against public reference ranges, get a plain-English note for flagged values. Nothing leaves your laptop."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arthur", email = "levi74108520963@gmail.com" }]
requires-python = ">=3.11"
keywords = ["lab-results", "blood-test", "ocr", "health", "offline", "mlx", "glm-ocr", "ollama", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Utilities",
]
dependencies = [
    "fastapi==0.142.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.20",
    "pymupdf==1.26.5",
    "reportlab==4.4.4",
    "mlx-vlm==0.7.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/Arthur031221/labexplain"
Issues = "https://github.com/Arthur031221/labexplain/issues"
Changelog = "https://github.com/Arthur031221/labexplain/blob/main/CHANGELOG.md"

[project.scripts]
labexplain = "labexplain.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "pillow==12.3.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labexplain"]

[tool.hatch.build.targets.wheel.force-include]
"src/labexplain/data/reference_ranges.json" = "labexplain/data/reference_ranges.json"

[tool.hatch.build.targets.sdist]
include = ["src/labexplain", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
